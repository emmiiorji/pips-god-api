components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [user, admin]
      example:
        id: 5ebac534954b54139806c112
        email: fake@example.com
        name: fake name
        role: user

    Token:
      type: object
      properties:
        token:
          type: string
        expires:
          type: string
          format: date-time
      example:
        token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI1ZWJhYzUzNDk1NGI1NDEzOTgwNmMxMTIiLCJpYXQiOjE1ODkyOTg0ODQsImV4cCI6MTU4OTMwMDI4NH0.m1U63blB0MLej_WfB7yC2FTMnCziif9X8yzwDEfJXAg
        expires: 2020-05-12T16:18:04.793Z
    
    TransactionVerified:
      type: object
      properties:
        authorizationUrl:
          type: string
        reference:
          type: string
      example:
        authorizationUrl: https://checkout.paystack.com/cy9nc475tu3u72i
        reference: dbu9exwscy
    
    TransactionCreated:
      type: object
      properties:
        status:
          type: string
        registrationUrl:
          type: string
      example:
        status: success
        registrationUrl: http://localhost:3000/register/5lhzjfpryj

    Transaction:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        email:
          type: string
          format: email
        authorizationURL:
          type: string
        reference:
          type: string
        accessCode:
          type: string
        amount:
          type: number
          description: Amount in kobo
        currency:
          type: string
      example:
        id: 5ebac534954b54139806c112
        status: initiated
        email: username@email.com
        authorization_url: https://checkout.paystack.com/6wz1fgwoybbvswx
        reference: h2i5kmghejx05j1
        access_code: 6wz1fgwoybbvswx
        amount: 100000
        currency: NGN
    
    Notification:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        body:
          type: text
          format: email
        userId:
          type: string
      example:
        id: 5ebac534954b54139806c112
        title: Welcome
        body: username@email.com
        userId: 5ebac534954b54139806c112

    AuthTokens:
      type: object
      properties:
        access:
          $ref: '#/components/schemas/Token'
        refresh:
          $ref: '#/components/schemas/Token'

    Error:
      type: object
      properties:
        code:
          type: number
        message:
          type: string

  responses:
    SubscriptionPlanNameNotFound:
      description: Subscription plan name not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 404
            message: Subscription plan name not found
    DuplicateEmail:
      description: Email already taken
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 400
            message: Email already taken
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 401
            message: Please authenticate
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 403
            message: Forbidden
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 404
            message: Not found

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
